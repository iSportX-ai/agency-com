name: Aishwaryam Cron

on:
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest

    steps:
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Run cron through browser
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage();

            page.on('request', request => {
              console.log('REQUEST:', request.method(), request.url());
            });

            page.on('response', response => {
              console.log('RESPONSE:', response.status(), response.url());
            });

            page.on('requestfailed', request => {
              console.log('REQUEST FAILED:', request.url(), request.failure()?.errorText);
            });

            console.log('Opening cron URL...');

            try {
              const response = await page.goto(process.env.CRON_URL, {
                waitUntil: 'commit',
                timeout: 60000
              });

              console.log('Initial HTTP status:', response ? response.status() : 'unknown');
            } catch (err) {
              console.log('Initial navigation error:', err.message);
            }

            console.log('URL after initial navigation:', page.url());

            await page.waitForTimeout(15000);

            console.log('URL after waiting:', page.url());
            console.log('Title:', await page.title());

            const body = await page.locator('body').innerText().catch(() => '');
            console.log('PAGE TEXT:');
            console.log(body.substring(0, 3000));

            const cookies = await page.context().cookies();
            console.log('COOKIES:', cookies.map(c => c.name));

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF
