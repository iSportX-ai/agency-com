name: Aishwaryam Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest

    steps:
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: Run cron through browser
        env:
          CRON_URL: ${{ secrets.CRON_URL }}
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();

            const response = await page.goto(process.env.CRON_URL, {
              waitUntil: 'commit',
              timeout: 60000
            });

            console.log('HTTP status:', response ? response.status() : 'unknown');

            await page.waitForTimeout(5000);

            console.log('Cron URL:', page.url());

            const body = await page.locator('body').innerText().catch(() => '');
            console.log(body);

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF
